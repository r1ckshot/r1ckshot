name: GitHub 3D Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - uses: actions/checkout@v3

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: r1ckshot
        with:
          MAX_REPOS: 10
          SETTING_JSON: |
            {
              "githubUserName": "r1ckshot",
              "totalContributions": true,
              "contributionColorArray": ["#112240", "#0d2d4f", "#1a4a6e", "#2d7a6e", "#64ffda"],
              "backgroundColor": "#0a192f",
              "foregroundColor": "#8892b0",
              "outlineColor": "#64ffda20",
              "warnColor": "#64ffda",
              "alertColor": "#64ffda"
            }

      - name: Push to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "chore: update 3D contribution graph" || echo "Nothing to commit"
          git push origin main
