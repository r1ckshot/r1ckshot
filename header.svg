<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020c1b"/>
      <stop offset="40%" stop-color="#0a192f"/>
      <stop offset="70%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0a192f"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.3 0; 0.3 0; -0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#64ffda" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#64ffda" stop-opacity="0.15"/>
      <stop offset="50%"  stop-color="#64ffda" stop-opacity="0.75"/>
      <stop offset="70%"  stop-color="#64ffda" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a192f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020c1b" stop-opacity="0.75"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cornerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="dotFade" cx="50%" cy="50%" r="50%">
      <stop offset="20%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="edgeFade">
      <rect width="900" height="200" fill="url(#dotFade)"/>
    </mask>

  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.035" stroke="#64ffda" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Vignette -->
  <rect width="900" height="200" fill="url(#vignette)"/>

  <!-- Particles -->
  <g mask="url(#edgeFade)">

    <!-- Centre / general -->
    <circle cx="450" cy="185" r="2.5" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.8;0" dur="4.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="185;175;185" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="25" r="1.8" fill="#8892b0">
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="25;15;25" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="20" r="1.5" fill="#8892b0">
      <animate attributeName="opacity" values="0;0.65;0" dur="3.8s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="20;10;20" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="490" cy="15" r="1.0" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.75;0" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="75" r="1.1" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.8s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="630" cy="170" r="1.2" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.7;0" dur="3.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="178" r="1.6" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.8;0" dur="3.5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="178;168;178" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="160" r="2.2" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.85;0" dur="5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;148;160" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="155" r="2.4" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="155;143;155" dur="4.2s" repeatCount="indefinite"/>
    </circle>

    <!-- LEFT edge extras -->
    <circle cx="18" cy="60" r="2.0" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.85;0" dur="4s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;50;60" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="110" r="1.6" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.7;0" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;100;110" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="155" r="1.3" fill="#8892b0">
      <animate attributeName="opacity" values="0;0.6;0" dur="3.9s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="155;145;155" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="80" r="1.1" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.65;0" dur="4.4s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="30" r="1.8" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.7s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;20;30" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="90" r="1.0" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.55;0" dur="5.8s" begin="1.9s" repeatCount="indefinite"/>
    </circle>

    <!-- RIGHT edge extras -->
    <circle cx="882" cy="60" r="2.0" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.85;0" dur="4.1s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;50;60" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="865" cy="115" r="1.6" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="115;105;115" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="878" cy="158" r="1.3" fill="#8892b0">
      <animate attributeName="opacity" values="0;0.6;0" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="158;148;158" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="845" cy="85" r="1.1" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.65;0" dur="4.6s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="858" cy="32" r="1.8" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="32;22;32" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="885" cy="95" r="1.0" fill="#64ffda">
      <animate attributeName="opacity" values="0;0.55;0" dur="6s" begin="2.3s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Corner accent top-left -->
  <g filter="url(#cornerGlow)">
    <line x1="20" y1="20" x2="65" y2="20" stroke="#64ffda" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="20" x2="20" y2="60" stroke="#64ffda" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="0s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Corner accent top-right -->
  <g filter="url(#cornerGlow)">
    <line x1="835" y1="20" x2="880" y2="20" stroke="#64ffda" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </line>
    <line x1="880" y1="20" x2="880" y2="60" stroke="#64ffda" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Corner accent bottom-left -->
  <g filter="url(#cornerGlow)">
    <line x1="20" y1="180" x2="65" y2="180" stroke="#64ffda" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="20" y1="140" x2="20" y2="180" stroke="#64ffda" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Corner accent bottom-right -->
  <g filter="url(#cornerGlow)">
    <line x1="835" y1="180" x2="880" y2="180" stroke="#64ffda" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </line>
    <line x1="880" y1="140" x2="880" y2="180" stroke="#64ffda" stroke-width="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Main title -->
  <text
    x="450" y="92"
    font-family="'Courier New', Courier, monospace"
    font-size="36"
    font-weight="700"
    fill="#64ffda"
    text-anchor="middle"
    letter-spacing="3"
    filter="url(#glow)">
    Mykhailo Kapustianyk
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Shimmer divider -->
  <rect x="180" y="108" width="540" height="1" fill="url(#shimmer)" rx="1"/>

  <!-- Subtitle -->
  <text
    x="450" y="148"
    font-family="'Courier New', Courier, monospace"
    font-size="18"
    fill="#8892b0"
    text-anchor="middle"
    letter-spacing="2"
    filter="url(#glowSoft)">
    Christian  ✦  Agent Engineer  ✦  MSc Student
  </text>

</svg>
